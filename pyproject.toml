[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btcq"
version = "0.1.0"
description = "BTCUSDT perpetual strategy research and signal bot"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "numba>=0.60",
    "scipy>=1.13",
    "plotly>=5.20",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["websockets>=12"]
external = ["xlrd==2.0.1"]     # round 6: EIA spot spreadsheets

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"btcq.live" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
