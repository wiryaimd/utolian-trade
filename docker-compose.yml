services:
  bot:
    build: .
    container_name: btcq-paper
    env_file: .env
    volumes:
      - ./state:/app/state      # SQLite state, trades, logs, heartbeat
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  dashboard:
    build: .
    container_name: btcq-dashboard
    command: ["python", "-m", "btcq.live", "dashboard", "--host", "0.0.0.0", "--port", "8080"]
    # Least privilege: only the dashboard login, never the bot's Binance/Telegram secrets
    # (Compose fills these from .env).
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_BIND: ${DASHBOARD_BIND:-127.0.0.1}
    volumes:
      - ./state:/app/state:ro   # read-only mount; SQLite is also opened with mode=ro
    ports:
      # Default: VPS localhost only (open it through an SSH tunnel).
      # DASHBOARD_BIND=0.0.0.0 in .env publishes it on the server's public IP (plain HTTP + password).
      - "${DASHBOARD_BIND:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    # The VPS has 1 core shared with the bot: a flooded dashboard must not starve trading.
    cpus: "0.5"
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 2m
